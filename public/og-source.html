<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1200" />
  <title>Brewio social preview</title>
  <!-- Source for og-image.png (1200×630). Render it from the dev server with a headless browser. -->
  <link rel="stylesheet" href="/fonts/fonts.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body { width: 1200px; height: 630px; overflow: hidden; background: #FAF7F2; }

    .og {
      position: relative;
      width: 1200px;
      height: 630px;
      display: flex;
      font-family: 'DM Sans', system-ui, sans-serif;
      color: #1C1A17;
    }

    .left {
      width: 640px;
      padding: 72px 0 0 76px;
      display: flex;
      flex-direction: column;
    }

    .brand { display: flex; align-items: center; gap: 16px; }
    .brand img { width: 64px; height: 64px; border-radius: 15px; box-shadow: 0 1px 2px rgba(28, 26, 23, 0.12); }
    .brand span { font-family: 'Playfair Display', Georgia, serif; font-weight: 600; font-size: 36px; letter-spacing: -0.01em; }

    h1 {
      margin-top: 56px;
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 600;
      font-size: 64px;
      line-height: 1.04;
      letter-spacing: -0.025em;
      max-width: 520px;
    }

    p { margin-top: 26px; font-size: 24px; line-height: 1.5; color: #57524A; max-width: 520px; text-wrap: balance; }

    .phones { position: absolute; top: 58px; right: 70px; display: flex; align-items: flex-start; }

    .phone {
      padding: 7px;
      background: #141210;
      border-radius: 15% / 7%;
      box-shadow: 0 1px 2px rgba(28, 26, 23, 0.1), 0 24px 48px -16px rgba(28, 26, 23, 0.35);
    }

    .phone img { display: block; width: 100%; border-radius: 13.6% / 6.3%; }
    .back { width: 250px; margin-top: 46px; margin-right: -36px; }
    .front { width: 280px; position: relative; }
  </style>
</head>
<body>
  <div class="og">
    <div class="left">
      <div class="brand">
        <img src="/app/icon.png" alt="" />
        <span>Brewio</span>
      </div>
      <h1>The coffee journal for home brewers</h1>
      <p>Log your brews, follow recipes with a timer and keep track of your beans. Free on iPhone.</p>
    </div>
    <div class="phones">
      <div class="phone back"><img src="/app/journal.webp" alt="" /></div>
      <div class="phone front"><img src="/app/home.webp" alt="" /></div>
    </div>
  </div>
</body>
</html>
